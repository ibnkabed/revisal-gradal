# Revisal iPhone app (XcodeGen). Built unsigned by .github/workflows/build-ipa.yml.
name: Revisal
options:
  bundleIdPrefix: io.github.ibnkabed
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
# Firebase AI Logic (hybrid on-device + cloud AI), App Check and Remote Config (#BuildHybridAI, 2026-11-23)
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.2.0
targets:
  Revisal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Revisal
        excludes:
          - "GoogleService-Info.plist"
      # written by CI from a repository secret; absent in a plain checkout (the app then hides the built-in AI)
      - path: Revisal/GoogleService-Info.plist
        optional: true
        buildPhase: resources
      - path: ../bank
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ibnkabed.revisal
        PRODUCT_NAME: Revisal
        INFOPLIST_FILE: Revisal/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        APP_CHECK_DEBUG_TOKEN: ""
    dependencies:
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseRemoteConfig
  # CI only: checks the review rules, the bank draw and the bundled banks.
  RevisalCheck:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Revisal/Model/Models.swift
      - path: Revisal/Model/Localize.swift
      - path: Revisal/Review/ReviewRules.swift
      - path: Revisal/Review/Pattern.swift
      - path: Revisal/Book/BookRules.swift
      - path: Revisal/Bank/Bank.swift
      - path: RevisalCheck
    settings:
      base:
        PRODUCT_NAME: RevisalCheck
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
